[package]
name = "snitch"
version = "0.9.0"
edition = "2024"
description = "GTK4 prompt UI for the OpenSnitch daemon"
license = "MIT"

[dependencies]
async-channel = "2.5.0"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
libadwaita = { version = "0.9.2", features = ["v1_4"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tonic-prost-build = "0.14.6"

# The opensnitchd old gRPC library sends an invalid ":authority"
# that h2 rejects, this fork fixes the issue.
[patch.crates-io]
h2 = { git = "https://github.com/jeronimoalbi/h2", branch = "snitch-authority" }
