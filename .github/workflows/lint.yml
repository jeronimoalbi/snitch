name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    uses: ./.github/workflows/_arch-cargo.yml
    with:
      build-deps: true
      cache-key: lint
      script: |
        cargo clippy --version
        cargo clippy --all-targets --locked -- -D warnings
